name: Udemy Deal Check

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # lets you run it manually from the Actions tab

permissions:
  contents: write             # needed to save seen.json / state.json back to the repo

concurrency:
  group: deal-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new deals and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_deals.py

      - name: Save seen.json and state.json
        if: always()
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          for f in seen.json state.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing to save"
            exit 0
          fi
          git commit -m "update bot state"
          # If someone pushed while this run was working, take their changes and put ours on top.
          # On a clash in the state files, the bot's newest state wins. Retry a few times.
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then
              echo "state saved"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "save attempt $i failed, retrying"
            sleep $((i * 4))
          done
          echo "could not save the bot state"
          exit 1
