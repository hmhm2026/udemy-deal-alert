<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1b5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Free Testing Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e8e3f8; --ticket: #ffffff; --ink: #1c1240; --muted: #5d5580; --rule: #cfc7ea;
    --stub: #2a1b5e; --stub-ink: #ffffff; --hot: #ff7a1a; --hot-ink: #1a0f00;
    --dead: #d9d4ea; --dead-ink: #6d6690; --pass: #0f7a52; --gone: #b3263e; --gone-ink: #ffffff; --gone-bg: #fde7ea;
    --btn: #1c1240; --btn-ink: #ffffff; --warn-bg: #fff1dc; --warn-ink: #8a5300; --focus: #5b3df5;
    --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "DM Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #120d27; --ticket: #1e1744; --ink: #efeaff; --muted: #a9a0d0; --rule: #3a3068;
      --stub: #2e2468; --stub-ink: #ffffff; --hot: #ff8a33; --hot-ink: #1a0f00;
      --dead: #2a2352; --dead-ink: #8d84b8; --pass: #5be0a8; --gone: #ff6b81; --gone-ink: #2b0008; --gone-bg: #3d1420;
      --btn: #efeaff; --btn-ink: #120d27; --warn-bg: #3a2a0a; --warn-ink: #ffcc80; --focus: #a899ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--body);
    padding: env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header { padding: 30px 0 6px; }
  h1 { font: 800 clamp(1.7rem, 7vw, 2.4rem)/1.08 var(--display); letter-spacing: -0.03em; margin: 0 0 12px; }
  .sub { color: var(--muted); margin: 0; max-width: 42ch; }

  .tools { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 14px; }
  input[type=search] {
    flex: 1 1 200px; min-width: 0; min-height: 46px; padding: 10px 18px; font: inherit; color: var(--ink);
    background: var(--ticket); border: 1px solid var(--rule); border-radius: 999px;
  }
  button.chip {
    min-height: 46px; padding: 10px 18px; font: 500 .9rem var(--body); cursor: pointer; color: var(--ink);
    background: var(--ticket); border: 1px solid var(--rule); border-radius: 999px;
  }
  button.chip[aria-pressed="true"] { background: var(--stub); color: var(--stub-ink); border-color: var(--stub); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  .count { font: 500 .8rem/1 var(--mono); color: var(--muted); margin: 0 0 12px; letter-spacing: .03em; text-transform: uppercase; }

  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }

  /* signature: each course is a ticket; the stub carries its age */
  li.ticket {
    position: relative; display: grid; grid-template-columns: 88px 1fr;
    background: var(--ticket); border-radius: 14px; overflow: visible;
    box-shadow: 0 1px 0 var(--rule), 0 8px 18px -12px rgba(28, 18, 64, .45);
    animation: rise .35s ease both;
  }
  .stub {
    background: var(--stub); color: var(--stub-ink); border-radius: 14px 0 0 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 14px 6px; text-align: center;
  }
  .stub .n { font: 800 1.55rem/1 var(--display); letter-spacing: -0.04em; }
  .stub .u { font: 500 .7rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .stub .t { font: 500 .62rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-top: 4px; }
  li.ticket.fresh .stub { background: var(--hot); color: var(--hot-ink); }
  li.ticket.stale .stub { background: var(--dead); color: var(--dead-ink); }
  li.ticket.stale { opacity: .85; }
  li.ticket.gone .stub { background: var(--gone); color: var(--gone-ink); }
  li.ticket.gone .title { color: var(--muted); }
  .gone-line { display: block; background: var(--gone-bg); color: var(--gone); border-radius: 8px; padding: 6px 10px; font: 600 .85rem/1.35 var(--body); margin-bottom: 12px; }
  /* perforation + notches */
  li.ticket::before, li.ticket::after {
    content: ""; position: absolute; left: 80px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); z-index: 1;
  }
  li.ticket::before { top: -8px; }
  li.ticket::after { bottom: -8px; }
  .main { padding: 14px 16px 16px 20px; border-left: 2px dashed var(--rule); min-width: 0; }
  .title { font: 600 1.02rem/1.3 var(--body); margin: 0 0 6px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 12px; color: var(--muted); font-size: .84rem; margin-bottom: 12px; }
  .meta .ok { color: var(--pass); font-weight: 500; }
  .old { display: inline-block; background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 3px 8px; font-size: .8rem; margin-bottom: 12px; }
  a.open {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px;
    text-decoration: none; font-weight: 600; background: var(--btn); color: var(--btn-ink);
  }
  a.open.dim { background: transparent; color: var(--muted); border: 1px solid var(--rule); }

  .empty { text-align: center; color: var(--muted); padding: 48px 8px; border: 2px dashed var(--rule); border-radius: 14px; }
  footer { font: 400 .75rem/1.4 var(--mono); color: var(--muted); text-align: center; margin-top: 28px; }

  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { li.ticket { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Free Testing Courses</h1>
    <p class="sub">Courses the bot sent, newest first. Free coupons end fast, so open them quickly.</p>
  </header>

  <div class="tools">
    <input id="q" type="search" placeholder="Search courses" aria-label="Search courses" autocomplete="off">
    <button class="chip" id="f24" aria-pressed="true">Last 24 h</button>
    <button class="chip" id="fall" aria-pressed="false">All</button>
    <button class="chip" id="refresh">Refresh</button>
  </div>

  <p class="count" id="count" role="status"></p>
  <ul id="list"></ul>
  <footer id="foot"></footer>
</div>

<script>
(function () {
  var SOURCES = [
    "https://raw.githubusercontent.com/hmhm2026/udemy-deal-alert/main/history.json",
    "history.json"
  ];
  var all = [], onlyRecent = true, loadedAt = null;
  var $ = function (id) { return document.getElementById(id); };

  function ago(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    if (m < 48 * 60) return Math.floor(m / 60) + " h ago";
    return Math.floor(m / 1440) + " days ago";
  }
  function short(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return "";
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return "now";
    if (m < 60) return m + "m";
    if (m < 48 * 60) return Math.floor(m / 60) + "h";
    return Math.floor(m / 1440) + "d";
  }
  function parts(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return { n: "?", u: "" };
    var m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return { n: "0", u: "min" };
    if (m < 60) return { n: String(m), u: "min" };
    if (m < 48 * 60) { var hh = Math.floor(m / 60); return { n: String(hh), u: hh === 1 ? "hour" : "hours" }; }
    var dd = Math.floor(m / 1440);
    return { n: String(dd), u: dd === 1 ? "day" : "days" };
  }
  function fmtTime(iso) {
    var t = new Date(iso);
    if (isNaN(t.getTime())) return "";
    var same = t.toDateString() === new Date().toDateString();
    return same
      ? t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : t.toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  function endedText(h) {
    var e = Date.parse(h.ended), l = Date.parse(h.last_ok || h.at);
    if (isNaN(e)) return "Coupon ended";
    if (!h.last_ok && (e - l) > 20 * 60000)
      return "Found ended at " + fmtTime(h.ended) + " (" + ago(h.ended) + "), it may have ended earlier";
    var txt = (!isNaN(l) && (e - l) > 20 * 60000)
      ? "Coupon ended between " + fmtTime(h.last_ok || h.at) + " and " + fmtTime(h.ended)
      : "Coupon ended around " + fmtTime(h.ended);
    return txt + " (" + ago(h.ended) + ")";
  }
  function ageHours(iso) {
    var t = Date.parse(iso);
    return isNaN(t) ? 9999 : (Date.now() - t) / 3600000;
  }
  function safeUrl(u) {
    return typeof u === "string" && /^https:\/\/(www\.)?udemy\.com\//.test(u) ? u : "";
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    var q = $("q").value.trim().toLowerCase();
    var rows = all.filter(function (h) {
      if (onlyRecent && ageHours(h.at) > 24) return false;
      return !q || (h.title || "").toLowerCase().indexOf(q) !== -1;
    });
    var list = $("list");
    list.textContent = "";
    $("count").textContent = rows.length + (rows.length === 1 ? " course" : " courses");
    if (!rows.length) {
      list.appendChild(el("li", "empty", all.length
        ? "Nothing in this view. Try All."
        : "No courses yet. The bot adds one here each time it sends an alert."));
    }
    rows.forEach(function (h, idx) {
      var url = safeUrl(h.url);
      var hrs = ageHours(h.at);
      var stale = hrs > 24, fresh = hrs < 1;
      var gone = !!h.ended;
      var li = el("li", "ticket" + (gone ? " gone" : "") + (fresh && !gone ? " fresh" : "") + (stale && !gone ? " stale" : ""));
      li.style.animationDelay = Math.min(idx, 8) * 40 + "ms";

      var pr = parts(h.at);
      var stub = el("div", "stub");
      stub.appendChild(el("span", "n", pr.n));
      stub.appendChild(el("span", "u", pr.u));
      if (gone) stub.appendChild(el("span", "t", "Ended"));
      else if (fresh) stub.appendChild(el("span", "t", "New"));
      li.appendChild(stub);

      var body = el("div", "main");
      body.appendChild(el("p", "title", h.title || "Untitled course"));

      var meta = el("div", "meta");
      meta.appendChild(el("span", "", "Sent " + ago(h.at)));
      if (h.listed) meta.appendChild(el("span", "", "Posted on source " + ago(h.listed)));
      if (h.source) meta.appendChild(el("span", "", h.source));
      if (h.note) meta.appendChild(el("span", /Verified/.test(h.note) ? "ok" : "", h.note.replace(/^[^\w]+/, "")));
      body.appendChild(meta);

      if (gone) body.appendChild(el("span", "gone-line", endedText(h)));
      else if (stale) body.appendChild(el("div", "old", "Sent over 24 h ago - the coupon may have ended"));
      if (url) {
        var a = el("a", "open" + (stale || gone ? " dim" : ""), "Open course");
        a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
        body.appendChild(a);
      }
      li.appendChild(body);
      list.appendChild(li);
    });
    $("foot").textContent = loadedAt ? "Updated " + ago(loadedAt.toISOString()) : "";
  }

  function load(i) {
    i = i || 0;
    if (i >= SOURCES.length) { $("count").textContent = "Could not load the list."; return; }
    var sep = SOURCES[i].indexOf("?") === -1 ? "?" : "&";
    fetch(SOURCES[i] + sep + "t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        all = (Array.isArray(data) ? data : []).slice().sort(function (a, b) {
          return Date.parse(b.at) - Date.parse(a.at);
        });
        loadedAt = new Date();
        render();
      })
      .catch(function () { load(i + 1); });
  }

  function setMode(recent) {
    onlyRecent = recent;
    $("f24").setAttribute("aria-pressed", recent);
    $("fall").setAttribute("aria-pressed", !recent);
    render();
  }
  $("q").addEventListener("input", render);
  $("f24").addEventListener("click", function () { setMode(true); });
  $("fall").addEventListener("click", function () { setMode(false); });
  $("refresh").addEventListener("click", function () { load(0); });
  setInterval(function () { load(0); }, 120000);
  load(0);
})();
</script>
</body>
</html>
